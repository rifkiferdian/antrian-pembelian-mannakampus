<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>{{ .Title }} | Sistem Antrean Supplier</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

        <script>
            window.tailwind = window.tailwind || {};
            window.tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            display: ["Manrope", "ui-sans-serif", "system-ui"],
                        },
                        colors: {
                            brand: {
                                50: "#fff7ed",
                                100: "#ffedd5",
                                200: "#fed7aa",
                                300: "#fdba74",
                                400: "#fb923c",
                                500: "#f57c00",
                                600: "#e56f00",
                                700: "#c25700",
                                800: "#9a4200",
                                900: "#7a3200",
                            },
                        },
                        boxShadow: {
                            soft: "0 16px 30px -20px rgba(15, 23, 42, 0.35)",
                        },
                    },
                },
            };
        </script>
        <script src="https://cdn.tailwindcss.com"></script>

        <style>
            .ticket-bg {
                background: radial-gradient(120% 120% at 50% -10%, #ffffff 0%, #f9f7f3 45%, #f2f4f7 100%);
            }
            .ticket-card {
                background: #ffffff;
                border: 1px solid rgba(226, 232, 240, 0.7);
                box-shadow: 0 16px 28px -22px rgba(15, 23, 42, 0.35);
            }
            @media print {
                .no-print {
                    display: none !important;
                }
                body {
                    background: #ffffff;
                }
            }
        </style>
    </head>

    <body class="ticket-bg min-h-screen font-display text-slate-800">
        <main class="mx-auto flex min-h-screen w-full max-w-lg flex-col px-4 py-10 sm:px-6">
            <div class="ticket-card rounded-[28px] p-6 text-center sm:p-8">
                <div class="flex justify-center">
                    <span class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-brand-50 text-brand-500">
                        <svg viewBox="0 0 24 24" class="h-8 w-8" fill="currentColor" aria-hidden="true">
                            <path d="M12 2l2.9 6.6L22 12l-7.1 3.4L12 22l-2.9-6.6L2 12l7.1-3.4L12 2z"></path>
                        </svg>
                    </span>
                </div>
                <h1 class="mt-4 text-lg font-bold uppercase text-slate-900">Tiket Antrean</h1>
                <p class="mt-1 text-xs text-slate-500">{{ .Ticket.StoreName }}</p>

                <div class="mt-6 rounded-2xl border border-dashed border-slate-200 bg-slate-50 px-4 py-6">
                    <p class="text-xs font-semibold uppercase tracking-[0.3em] text-slate-400">Nomor Anda</p>
                    <p class="mt-3 text-4xl font-extrabold tracking-widest text-brand-500">{{ .Ticket.TicketNo }}</p>
                    <p class="mt-3 text-xs text-slate-500">{{ .Ticket.CategoryName }} - {{ .Ticket.CounterName }}</p>
                </div>

                <div class="mt-6 grid gap-3 text-left text-xs text-slate-500">
                    <div class="flex items-center justify-between">
                        <span>Tanggal</span>
                        <span class="font-semibold text-slate-700">{{ .Ticket.TicketDate }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span>Waktu</span>
                        <span class="font-semibold text-slate-700">{{ .Ticket.CreatedAt }}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span>Loket</span>
                        <span class="font-semibold text-slate-700">{{ .Ticket.CounterName }}</span>
                    </div>
                </div>

                <div class="no-print mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
                    <button type="button" onclick="window.print()" class="inline-flex items-center justify-center rounded-full bg-brand-500 px-6 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-white shadow-soft transition hover:bg-brand-600">
                        Cetak Tiket
                    </button>
                    <a href="/guest" class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-6 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-slate-600 transition hover:border-brand-200 hover:text-brand-600">
                        Ambil Lagi
                    </a>
                </div>
            </div>
        </main>
    </body>
</html>
