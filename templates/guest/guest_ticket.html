<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>

<style>
/* PALING PENTING */
@page {
  size: 80mm auto;
  margin: 0mm;     /* HAPUS margin printer */
}

html, body{
  margin:0 !important;
  padding:0 !important;
  width:72mm;
  font-family: Arial, sans-serif;
}

/* Hilangkan spacing default */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* Receipt */
.receipt{
  width:72mm;
  padding:0 2mm 2mm 2mm; /* TANPA padding atas */
  line-height:1;
}

/* Text style */
.center{ text-align:center; }
.bold{ font-weight:700; }

.brand{
  font-size:12px;
  margin-top:-2mm;   /* TARIK NAIK lagi */
}

.queue{
  font-size:48px;
  font-weight:800;
  margin:1mm 0;
}

.service{
  font-size:14px;
  margin-bottom:1mm;
}

.meta{
  font-size:10px;
}

.hr{
  border-top:1px dashed #000;
  margin:1.5mm 0;
}

/* tombol test */
@media print{
  button{ display:none; }
}
</style>
</head>

<body>

<!-- <button onclick="window.print()">PRINT</button> -->

<div class="receipt">
  <div class="center bold brand" style="margin-top: 10px;">
    ANTRIAN PEMBELIAN
  </div>

  <div class="center meta">
    Manna Kampus - {{ .Ticket.StoreName }}
  </div>

  <div class="hr"></div>

  <div class="center meta">NOMOR ANTRIAN</div>

  <div class="center queue">
    {{ .Ticket.TicketNo }}
  </div>

  <div class="center bold service">
    LOKET {{ .Ticket.CounterName }}
  </div>

  <div class="hr"></div>

  <div class="center meta">
    {{ .Ticket.CreatedAtDisplay }}
  </div>
</div>

<script>
window.addEventListener('load', function () {
  window.addEventListener('afterprint', function () {
    window.close();
  });
  setTimeout(function () {
    window.focus();
    window.print();
  }, 300);
});
</script>

</body>
</html>
