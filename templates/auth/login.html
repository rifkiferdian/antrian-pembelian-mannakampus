<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>{{ .Title }} | Stok Hadiah Manna Kampus</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Internal Document Management System">
        <link rel="shortcut icon" href="/assets/images/favicon.ico">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="{{ baseURL "/assets/css/font.css" }}" rel="stylesheet">

        <script>
            window.tailwind = window.tailwind || {};
            window.tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            display: ["Poppins", "ui-sans-serif", "system-ui"],
                            body: ["Poppins", "ui-sans-serif", "system-ui"],
                        },
                        colors: {
                            brand: {
                                50: "#fff7ed",
                                100: "#ffedd5",
                                200: "#fed7aa",
                                300: "#fdba74",
                                400: "#fb923c",
                                500: "#f57c00",
                                600: "#e56f00",
                                700: "#c25700",
                                800: "#9a4200",
                                900: "#7a3200",
                            },
                        },
                        boxShadow: {
                            card: "0 20px 45px -30px rgba(15, 23, 42, 0.4)",
                            soft: "0 10px 20px -12px rgba(245, 124, 0, 0.5)",
                        },
                    },
                },
            };
        </script>
        <script src="{{ baseURL "/assets/js/tailwind.js" }}"></script>

        <style>
            :root {
                color-scheme: light;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
            }
            .login-canvas {
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
                background:
                    radial-gradient(circle at 15% 15%, rgba(245, 124, 0, 0.28), transparent 45%),
                    radial-gradient(circle at 85% 15%, rgba(14, 116, 144, 0.25), transparent 44%),
                    linear-gradient(155deg, #0f172a 0%, #111827 45%, #1e293b 100%);
            }
            .page-shell {
                position: relative;
                z-index: 1;
                min-height: 100vh;
                isolation: isolate;
            }
            .page-shell::before {
                content: "";
                position: absolute;
                inset: 0;
                z-index: -1;
                background: linear-gradient(180deg, rgba(15, 23, 42, 0.16) 0%, rgba(15, 23, 42, 0.58) 88%);
                pointer-events: none;
            }
            .auth-card {
                background: rgba(255, 255, 255, 0.92);
                border: 1px solid rgba(255, 255, 255, 0.42);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
            }
        </style>

        <script>
            window.addEventListener("DOMContentLoaded", function () {
                const canvas = document.querySelector("[data-login-canvas]");
                if (!canvas) return;

                const ctx = canvas.getContext("2d");
                if (!ctx) return;

                const state = {
                    width: 0,
                    height: 0,
                    dpr: Math.min(window.devicePixelRatio || 1, 2),
                    particles: [],
                    mouse: { x: 0, y: 0, active: false },
                    lastTime: 0,
                };
                const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

                function randomBetween(min, max) {
                    return Math.random() * (max - min) + min;
                }

                function resize() {
                    state.width = window.innerWidth;
                    state.height = window.innerHeight;
                    canvas.width = Math.floor(state.width * state.dpr);
                    canvas.height = Math.floor(state.height * state.dpr);
                    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
                    buildParticles();
                    draw();
                }

                function buildParticles() {
                    const area = state.width * state.height;
                    const count = Math.max(40, Math.min(100, Math.floor(area / 17000)));
                    state.particles = [];
                    for (let i = 0; i < count; i += 1) {
                        state.particles.push({
                            x: randomBetween(0, state.width),
                            y: randomBetween(0, state.height),
                            vx: randomBetween(-0.22, 0.22),
                            vy: randomBetween(-0.2, 0.2),
                            radius: randomBetween(0.8, 2.4),
                            alpha: randomBetween(0.25, 0.75),
                        });
                    }
                }

                function draw() {
                    ctx.clearRect(0, 0, state.width, state.height);

                    for (let i = 0; i < state.particles.length; i += 1) {
                        const p = state.particles[i];

                        for (let j = i + 1; j < state.particles.length; j += 1) {
                            const q = state.particles[j];
                            const dx = q.x - p.x;
                            const dy = q.y - p.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist > 140) continue;
                            const opacity = (1 - dist / 140) * 0.28;
                            ctx.strokeStyle = "rgba(255, 255, 255, " + opacity.toFixed(3) + ")";
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(q.x, q.y);
                            ctx.stroke();
                        }

                        ctx.beginPath();
                        ctx.fillStyle = "rgba(255, 196, 134, " + p.alpha.toFixed(3) + ")";
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                function update(dt) {
                    for (const p of state.particles) {
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;

                        if (p.x < -12) p.x = state.width + 12;
                        if (p.x > state.width + 12) p.x = -12;
                        if (p.y < -12) p.y = state.height + 12;
                        if (p.y > state.height + 12) p.y = -12;

                        if (state.mouse.active) {
                            const dx = p.x - state.mouse.x;
                            const dy = p.y - state.mouse.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist > 0 && dist < 120) {
                                const force = (120 - dist) / 1200;
                                p.x += (dx / dist) * force * dt * 7;
                                p.y += (dy / dist) * force * dt * 7;
                            }
                        }
                    }
                }

                function animate(now) {
                    if (reduceMotion) {
                        draw();
                        return;
                    }

                    const dt = Math.min(32, now - (state.lastTime || now));
                    state.lastTime = now;
                    update(dt);
                    draw();
                    window.requestAnimationFrame(animate);
                }

                window.addEventListener("resize", resize);
                window.addEventListener("mousemove", function (event) {
                    state.mouse.x = event.clientX;
                    state.mouse.y = event.clientY;
                    state.mouse.active = true;
                });
                window.addEventListener("mouseleave", function () {
                    state.mouse.active = false;
                });
                window.addEventListener(
                    "touchmove",
                    function (event) {
                        const touch = event.touches && event.touches[0];
                        if (!touch) return;
                        state.mouse.x = touch.clientX;
                        state.mouse.y = touch.clientY;
                        state.mouse.active = true;
                    },
                    { passive: true }
                );
                window.addEventListener("touchend", function () {
                    state.mouse.active = false;
                });

                resize();
                window.requestAnimationFrame(animate);
            });
        </script>
    </head>

    <body class="min-h-screen overflow-x-hidden font-body text-slate-900">
        <canvas class="login-canvas" data-login-canvas aria-hidden="true"></canvas>
        <div class="page-shell flex min-h-screen flex-col">
            <header class="w-full">
                <div class="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-5 sm:px-6">
                    <div class="flex items-center gap-3">
                        <span class="text-orange-500">
                            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M12 2l2.9 6.6L22 12l-7.1 3.4L12 22l-2.9-6.6L2 12l7.1-3.4L12 2z"></path>
                            </svg>
                        </span>
                        <div>
                            <p class="text-sm font-semibold text-white">Manna Kampus</p>
                        </div>
                    </div>
                    <a href="#" class="rounded-md bg-orange-500 px-4 py-1.5 text-xs font-semibold text-white shadow-soft transition hover:bg-orange-600">Help</a>
                </div>
                <div class="mx-auto w-full max-w-5xl border-t border-white/25"></div>
            </header>

            <main class="flex flex-1 items-center justify-center px-4 py-10 sm:px-6">
                <div class="w-full max-w-sm">
                    <div class="auth-card rounded-2xl p-7 shadow-card">
                        <div class="text-center">
                            <div class="flex justify-center">
                                <span class="text-orange-500">
                                    <svg class="h-14 w-14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M12 2l2.9 6.6L22 12l-7.1 3.4L12 22l-2.9-6.6L2 12l7.1-3.4L12 2z"></path>
                                    </svg>
                                </span>
                            </div>
                            <h1 class="mt-4 text-lg font-display font-semibold text-slate-900">Sistem Antrian Pembelian</h1>
                            <p class="mt-1 text-[11px] text-slate-500">Enter your credentials to manage your counter</p>
                        </div>

                        {{ if .Error }}
                            <div class="mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600">
                                {{ .Error }}
                            </div>
                        {{ end }}

                        <form action="/login" method="post" class="mt-6 space-y-3.5">
                            <div>
                                <label for="username" class="text-xs font-medium text-slate-700">Username/Email</label>
                                <input id="username" name="username" type="text" placeholder="Enter your username or email" class="mt-2 w-full rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm shadow-sm outline-none transition focus:border-orange-500 focus:ring-4 focus:ring-orange-100" />
                            </div>

                            <div>
                                <label for="password" class="text-xs font-medium text-slate-700">Password</label>
                                <div class="mt-2 flex items-center rounded-lg border border-slate-200 bg-white px-3 shadow-sm focus-within:border-orange-500 focus-within:ring-4 focus-within:ring-orange-100">
                                    <input id="password" name="password" type="password" placeholder="Enter your password" class="w-full bg-transparent py-2.5 text-sm outline-none" />
                                    <button type="button" class="rounded-md px-2 py-1 text-slate-400 transition hover:text-orange-600" aria-label="Toggle password visibility" data-password-toggle>
                                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
                                            <circle cx="12" cy="12" r="3.5"></circle>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            
                            <br>
                            <button type="submit" class="mt-2 w-full rounded-lg bg-orange-500 py-2.5 text-sm font-semibold text-white shadow-soft transition hover:bg-orange-600">Login to System</button>
                        </form>

                        <div class="mt-5 flex items-center justify-between text-xs text-slate-400">
                            <a href="#" class="transition hover:text-orange-600">Forgot password?</a>
                            <span class="text-slate-300">|</span>
                            <a href="/view-queue-v2/5" target="_blank" class="transition hover:text-orange-600">View Queue</a>
                        </div>
                    </div>
                </div>
            </main>

            <footer class="py-8 text-center text-xs text-slate-300">
                &copy; <script>document.write(new Date().getFullYear())</script> Manna Kampus Retail. All rights reserved.
            </footer>
        </div>

        <script>
            const toggle = document.querySelector("[data-password-toggle]");
            const passwordInput = document.querySelector("#password");
            if (toggle && passwordInput) {
                toggle.addEventListener("click", () => {
                    const isPassword = passwordInput.type === "password";
                    passwordInput.type = isPassword ? "text" : "password";
                });
            }
        </script>
    </body>
</html>
